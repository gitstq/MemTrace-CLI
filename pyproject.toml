[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memtrace-cli"
version = "0.1.0"
description = "🧠 MemTrace-CLI — Lightweight Terminal AI Agent Shared Memory Engine"
readme = "README.md"
authors = [
    {name = "MemTrace Team"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
keywords = ["ai", "agent", "memory", "cli", "session", "tracking"]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/MemTrace-CLI"
Repository = "https://github.com/YOUR_USERNAME/MemTrace-CLI"
Documentation = "https://github.com/YOUR_USERNAME/MemTrace-CLI"

[project.scripts]
memtrace = "memtrace.cli:main"

[tool.setuptools.packages.find]
include = ["memtrace*"]