<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="brain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#0077b6"/>
    </linearGradient>
    <linearGradient id="trace1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b4d8;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#48cae4;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="trace2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0077b6;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00b4d8;stop-opacity:0.2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="60" fill="url(#bg)"/>

  <!-- Decorative circuit traces -->
  <g opacity="0.15">
    <path d="M50 200 Q100 160 150 200 Q200 240 250 200 Q300 160 350 200" 
          fill="none" stroke="#00b4d8" stroke-width="2"/>
    <path d="M50 250 Q100 210 150 250 Q200 290 250 250 Q300 210 350 250" 
          fill="none" stroke="#0077b6" stroke-width="1.5"/>
  </g>

  <!-- Memory nodes (dots) -->
  <g filter="url(#glow)">
    <circle cx="90" cy="130" r="4" fill="#00b4d8"/>
    <circle cx="310" cy="130" r="4" fill="#00b4d8"/>
    <circle cx="80" cy="270" r="3" fill="#48cae4"/>
    <circle cx="320" cy="270" r="3" fill="#48cae4"/>
    <circle cx="200" cy="100" r="3" fill="#90e0ef"/>
    <circle cx="200" cy="300" r="3" fill="#90e0ef"/>
  </g>

  <!-- Brain icon (stylized neural network) -->
  <g transform="translate(200,200)">
    <!-- Outer brain shape -->
    <ellipse cx="0" cy="0" rx="70" ry="55" fill="none" stroke="url(#brain)" 
             stroke-width="3.5" filter="url(#softGlow)" opacity="0.9"/>
    
    <!-- Inner brain detail -->
    <path d="M-40 -10 Q-20 -30 0 -15 Q20 -30 40 -10 Q50 5 35 20 Q20 35 0 25 
             Q-20 35 -35 20 Q-50 5 -40 -10Z" 
          fill="none" stroke="#48cae4" stroke-width="1.5" opacity="0.6"/>

    <!-- Neural connections -->
    <g stroke="#00b4d8" stroke-width="1.5" opacity="0.7">
      <line x1="-30" y1="-20" x2="0" y2="-5"/>
      <line x1="30" y1="-20" x2="0" y2="-5"/>
      <line x1="-20" y1="15" x2="0" y2="5"/>
      <line x1="20" y1="15" x2="0" y2="5"/>
      <line x1="-35" y1="0" x2="0" y2="-5"/>
      <line x1="35" y1="0" x2="0" y2="-5"/>
    </g>

    <!-- Neural nodes -->
    <g filter="url(#glow)">
      <circle cx="-30" cy="-20" r="4" fill="#00b4d8"/>
      <circle cx="30" cy="-20" r="4" fill="#00b4d8"/>
      <circle cx="0" cy="-5" r="5" fill="#0077b6"/>
      <circle cx="-20" cy="15" r="3.5" fill="#48cae4"/>
      <circle cx="20" cy="15" r="3.5" fill="#48cae4"/>
      <circle cx="-35" cy="0" r="3" fill="#90e0ef"/>
      <circle cx="35" cy="0" r="3" fill="#90e0ef"/>
      <circle cx="0" cy="5" r="3" fill="#90e0ef"/>
    </g>
  </g>

  <!-- Memory trace waveforms -->
  <g transform="translate(200,200)" filter="url(#glow)">
    <path d="M-80 55 Q-70 45 -60 55 Q-50 65 -40 55 Q-30 45 -20 55 Q-10 65 0 55" 
          fill="none" stroke="#48cae4" stroke-width="1.5" opacity="0.8"/>
    <path d="M20 55 Q30 45 40 55 Q50 65 60 55 Q70 45 80 55" 
          fill="none" stroke="#00b4d8" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Text: MemTrace -->
  <text x="200" y="315" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" 
        font-size="28" font-weight="700" fill="#e0e0e0" letter-spacing="4">
    MemTrace
  </text>
  
  <!-- Text: CLI -->
  <text x="200" y="340" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" 
        font-size="14" font-weight="400" fill="#48cae4" letter-spacing="6" opacity="0.8">
    CLI
  </text>

  <!-- Bottom accent line -->
  <line x1="120" y1="355" x2="280" y2="355" stroke="url(#trace1)" stroke-width="1.5" opacity="0.6"/>
</svg>